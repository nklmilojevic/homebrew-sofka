name: Bump formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.18.3); empty = latest"
        required: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view -R nklmilojevic/sofka --json tagName -q .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bump formula
        run: ./scripts/bump.sh "${{ steps.tag.outputs.tag }}"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sofka.rb
          git commit -m "sofka ${{ steps.tag.outputs.tag }}"
          git push
